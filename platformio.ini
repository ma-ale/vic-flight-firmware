[env:esp32-s3-devkitc-1]
platform = platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_filters = esp32_exception_decoder
build_type = debug

build_src_filter =
	${env.build_src_filter}
	+<esp32/board.cpp>

lib_deps =
	stm32duino/STM32duino LSM6DSO32@^1.0.0
	jgromes/RadioLib@^7.6.0
	robtillaart/float16@^0.3.1
	robtillaart/MS5611@^0.5.1

